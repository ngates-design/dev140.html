    <style>
        * {

            margin-top: 0.5rem;
            min-height: 1.25rem;
            display: none;
        }

        .submit-btn {
            width: 100%;
            padding: 0.75rem;
            background-color: #0066cc;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        .submit-btn:hover {
            background-color: #0052a3;
        }
    </style>
</head>

<body>

    <div class="signin-container">
        <h2>Sign In</h2>
        <form id="signinForm" novalidate>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <div id="errorMessage" class="error-message" role="alert"></div>

            <button type="submit" class="submit-btn">Sign In</button>
        </form>
          <!-- Submit Button -->
  <button type="submit">Sign In</button>

  <!-- Redirect to Create Account -->
  <p class="form-redirect">
    New to our site? <a href="signup.html">Create an account here</a>.
  </p>
</form>

    </div>

    <script>
        document.getElementById('signinForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const errorDisplay = document.getElementById('errorMessage');
            
            // Clear any previous error messages
            errorDisplay.textContent = '';
            errorDisplay.style.display = 'none';

            // Simple validation check
            if (!emailInput.value.trim() || !passwordInput.value.trim()) {
                errorDisplay.textContent = 'Please fill out all fields.';
                errorDisplay.style.display = 'block';
                return;
            }

            // Email format regex validation
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(emailInput.value.trim())) {
                errorDisplay.textContent = 'Please enter a valid email address.';
                errorDisplay.style.display = 'block';
                return;
            }

            // Placeholder for backend API integration
            alert('Form validation passed! Proceed to backend authentication.');
        });
    </script>
