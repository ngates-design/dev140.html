<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
</head>
<div class="form-container">
  <!-- Registration Form Wrapper -->
  <form action="/register-endpoint" method="POST">
    <h2>Create Your Account</h2>
    <p>Please fill out this form to register.</p>

    <!-- Full Name Field -->
    <div class="form-group">
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" placeholder="John Doe" required>
    </div>

    <!-- Email Field -->
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>
    </div>

    <!-- Password Field -->
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" minlength="8" placeholder="At least 8 characters" required>
    </div>

    <!-- Confirm Password Field -->
    <div class="form-group">
      <label for="confirm-password">Confirm Password</label>
      <input type="password" id="confirm-password" name="confirm_password" placeholder="Repeat your password" required>
    </div>

    <!-- Terms & Conditions Checkbox -->
    <div class="form-options">
      <label>
        <input type="checkbox" name="terms" required> I agree to the <a href="/terms">Terms of Service</a>
      </label>
    </div>

    <!-- Submit Button -->
    <button type="submit">Sign Up</button>

    <!-- Redirect Link back to Login -->
    <p class="form-redirect">
      Already have an account? <a href="index.html">Sign In here</a>.
    </p>
  </form>
</div>

</html>
